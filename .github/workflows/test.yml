name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matrix-of-one for now; adding 3.12 is one line when we're ready.
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Java 17 (PySpark needs it)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install all extras so Spark + Airflow + Streamlit suites all collect.
          pip install -e ".[dev,spark,airflow,streamlit]"

      - name: Initialise Airflow metadata DB
        # The orchestration tests' conftest does this lazily, but
        # running it explicitly here surfaces install errors faster.
        run: |
          export AIRFLOW_HOME="${{ runner.temp }}/airflow-home"
          export AIRFLOW__CORE__LOAD_EXAMPLES=False
          airflow db migrate

      - name: Run pytest
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: |
          pytest -q --tb=short

  dag-imports:
    name: Airflow DAG import validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Airflow + providers
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[airflow]"

      - name: Validate DAG imports
        run: |
          export AIRFLOW_HOME="${{ runner.temp }}/airflow-home"
          export AIRFLOW__CORE__LOAD_EXAMPLES=False
          export AIRFLOW__CORE__DAGS_FOLDER="$(pwd)/orchestration/dags"
          airflow db migrate
          # list-import-errors exits 0 even on errors, so we filter the
          # output for any failure markers and grep -v their absence.
          errors=$(airflow dags list-import-errors --output json)
          echo "$errors"
          # Empty array means no errors — accept either "[]" or empty.
          if [[ "$errors" != "[]" && -n "$errors" && "$errors" != "null" ]]; then
            echo "DAG import errors found"
            exit 1
          fi

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend off)
        # We init with -backend=false because we don't want to require
        # remote-state config in CI. Provider plugins still download.
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color
